name: 验证 Yahoo 数据源

# 第一轮只做验证：确认 GitHub runner 的出口 IP 不被 Yahoo 限流，
# 并逐个报告 51 个指数符号是否有效。通过后再改造成每日定时任务。
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install certifi
      - name: 抓取全部指数（近1月，先验证符号有效性）
        run: python3 scripts/fetch_yahoo.py --range 1mo
      - name: 抓取汇率
        run: python3 scripts/fetch_fx.py
      - name: 上传结果供查看
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-data
          path: data/raw/
          retention-days: 3
